on: [push, pull_request, workflow_dispatch]

name: Build

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generated macros are up to date (node macro_gen.js)
        run: node macro_gen.js && git diff --exit-code config/user_macros.dtsi
      - name: Keymap is formatted (python3 tools/adv360/fmt.py)
        run: python3 tools/adv360/fmt.py --check
      - name: Keymap parses (used by bin/keymap-ui and the e2e tests)
        run: |
          python3 - <<'EOF'
          import sys
          sys.path.insert(0, "tools")
          from adv360 import keymap
          data = keymap.load()
          print(f"{len(data['layers'])} layers, {len(data['layout'])} keys")
          EOF
      - name: Python tools compile
        run: python3 -m py_compile bin/keymap-ui bin/e2e bin/split-bench bin/split-soak bin/matrix-probe bin/link-log tools/adv360/*.py tests/e2e/*.py

  build:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include:
          # What bin/flash.sh flashes: ZMK Studio + USB bootloader reset on both halves
          - name: Clique
            artifact: firmware-clique
            version_tag: clique
            left_args: -S studio-rpc-usb-uart
            left_cmake: -DCONFIG_ZMK_STUDIO=y
          # Upstream's non-Studio flavor; the left half has no USB serial port,
          # so only the right half gets the USB bootloader reset
          - name: Legacy
            artifact: firmware-no-clique
            version_tag: ""
            left_args: ""
            left_cmake: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version data
        id: get_info
        run: |
          timestamp=$(date +"%Y%m%d%H%M")
          commit=$(echo "${{ github.sha }}" | cut -c1-7)
          file_prefix=$timestamp-$commit
          branch_name=$(echo "${{ github.ref }}" | awk -F'/' '{print $3}' | cut -c1-4)
          echo "file_prefix=$file_prefix" >> $GITHUB_OUTPUT
          bin/get_version.sh $branch_name $commit ${{ matrix.version_tag }}
      # Only west-managed directories: zmk-modules/ and tools/ belong to this
      # repo and must not be overwritten by a cache restore.
      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            zephyr/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
      - name: West Init
        run: west init -l config
      - name: West Update
        run: west update
      - name: West Zephyr export
        run: west zephyr-export
      # $GITHUB_WORKSPACE (not ${{ github.workspace }}): the path inside the container
      - name: Extra Zephyr modules
        run: echo "EXTRA_MODULES=${GITHUB_WORKSPACE}/zmk-modules/split-timing;${GITHUB_WORKSPACE}/zmk-modules/split-radio;${GITHUB_WORKSPACE}/zmk-modules/usb-bootloader-reset;${GITHUB_WORKSPACE}/zmk-modules/key-monitor;${GITHUB_WORKSPACE}/zmk-modules/smart-keys" >> $GITHUB_ENV
      - name: West Build (left)
        run: >
          west build -s zmk/app -d build/left -b adv360_left ${{ matrix.left_args }} --
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${EXTRA_MODULES}" ${{ matrix.left_cmake }}
      - name: Adv360 Left Kconfig file
        run: grep -vE '(^#|^$)' build/left/zephyr/.config
      - name: West Build (right)
        run: >
          west build -s zmk/app -d build/right -b adv360_right --
          -DZMK_CONFIG="${GITHUB_WORKSPACE}/config" -DZMK_EXTRA_MODULES="${EXTRA_MODULES}"
      - name: Adv360 Right Kconfig file
        run: grep -vE '(^#|^$)' build/right/zephyr/.config
      - name: Rename zmk.uf2
        run: cp build/left/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-left.uf2 && cp build/right/zephyr/zmk.uf2 ${{ steps.get_info.outputs.file_prefix }}-right.uf2
      - name: Archive (Adv360)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ steps.get_info.outputs.file_prefix }}-left.uf2
            ${{ steps.get_info.outputs.file_prefix }}-right.uf2
