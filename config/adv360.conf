# Reboot into the UF2 bootloader when the host sets 1200 baud on the
# USB serial port (see zmk-modules/usb-bootloader-reset and bin/flash.sh).
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_ZMK_USB_BOOTLOADER_RESET=y
# ... and a hung half resets itself (hardware watchdog), so that keeps working
CONFIG_WATCHDOG=y

# Shift-proof symbols (mod-morphs) don't swallow Shift for the next key when
# typing fast (zmk-modules/smart-keys)
CONFIG_ZMK_MOD_MORPH_UNMASK_ON_NEXT_KEY=y

# Key presses count after 5 ms instead of 15 ms (Kinesis' default; ZMK
# needs this many ms of a stable "pressed" reading). Releases need 5 ms
# stable too. 1 ms (docs/split-latency-research.md: debounce was the
# biggest delay per key) gave occasional doubled keys: a switch bouncing
# shut for a moment after a release already counted as a new press.
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# ZMK handles keys on the system work queue; nested event handling (sticky
# Shift around a macro, split-timing releasing captured key events, macros)
# overflowed its 1 KB stack and hung the left half (the watchdog reset it).
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
